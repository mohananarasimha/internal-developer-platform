apiVersion: v1
kind: Namespace
metadata:
  name: payments-team-staging
  labels:
    app.kubernetes.io/managed-by: idp-platform
    idp.local/team: payments-team
    idp.local/environment: staging
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-edit
  namespace: payments-team-staging
  labels:
    app.kubernetes.io/managed-by: idp-platform
    idp.local/team: payments-team
    idp.local/environment: staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: team:payments-team
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: payments-team-staging
  labels:
    app.kubernetes.io/managed-by: idp-platform
    idp.local/team: payments-team
    idp.local/environment: staging
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 1Gi
    limits.cpu: '2'
    limits.memory: 2Gi
    pods: '6'
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-defaults
  namespace: payments-team-staging
  labels:
    app.kubernetes.io/managed-by: idp-platform
    idp.local/team: payments-team
    idp.local/environment: staging
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 250m
      memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: payments-team-staging
  labels:
    app.kubernetes.io/managed-by: idp-platform
    idp.local/team: payments-team
    idp.local/environment: staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: payments-team-staging
  labels:
    app.kubernetes.io/managed-by: idp-platform
    idp.local/team: payments-team
    idp.local/environment: staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-peer-teams
  namespace: payments-team-staging
  labels:
    app.kubernetes.io/managed-by: idp-platform
    idp.local/team: payments-team
    idp.local/environment: staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: idp.local/team
          operator: In
          values:
          - ledger-team
        - key: idp.local/environment
          operator: In
          values:
          - staging
