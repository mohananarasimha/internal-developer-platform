{{- if gt (int .Values.sizing.maxReplicas) (int .Values.sizing.minReplicas) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "web-service.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "web-service.fullname" . }}
  minReplicas: {{ .Values.sizing.minReplicas }}
  maxReplicas: {{ .Values.sizing.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.sizing.targetCPU }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
