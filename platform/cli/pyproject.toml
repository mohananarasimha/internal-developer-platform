[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "idp-cli"
version = "0.1.0"
description = "Declarative Internal Developer Platform CLI for validating and rendering service.yaml specifications."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0.4",
  "typer>=0.29.2",
  "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.8",
]

[project.scripts]
idp = "idp_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/idp_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]
