environment: staging
metadata:
  name: payments-api
  owner: payments-team
  tier: critical
runtime:
  image: local/payments-api
  tag: 1.0.0
  port: 8080
  healthPath: /healthz
  metricsPath: /metrics
sizing:
  profile: small
  minReplicas: 1
  maxReplicas: 2
  targetCPU: 75
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  APP_ENV: staging
  APP_VERSION: 1.0.0
  LEDGER_REGION: us-east-1
  LOG_LEVEL: debug
  PAYMENT_TIMEOUT_MS: '2500'
secretRefs:
- payments-db-credentials
- payments-signing-keys
