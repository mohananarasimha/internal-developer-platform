environment: staging
namespace: ledger-team-staging
metadata:
  name: ledger-api
  owner: ledger-team
  tier: standard
runtime:
  image: local/payments-api
  tag: 1.0.0
  port: 8080
  healthPath: /healthz
  livenessPath: /livez
  metricsPath: /metrics
sizing:
  profile: small
  minReplicas: 1
  maxReplicas: 2
  targetCPU: 70
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  APP_ENV: staging
  APP_VERSION: 1.0.0
  LOG_LEVEL: info
secretRefs:
- ledger-db-credentials
