apiVersion: idp.local/v1
kind: ServiceSpec
metadata:
  name: payments-api
  owner: payments-team
  tier: critical
runtime:
  image: ghcr.io/mohananarasimha/payments-api
  tag: "1.2.0"
  port: 8080
  healthPath: /healthz
  metricsPath: /metrics
sizing:
  profile: small
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 70
env:
  LOG_LEVEL: info
  DB_PASSWORD: plaintext-not-allowed
  STRIPE_API_KEY: sk_test_placeholder_blocked
secretRefs: []
