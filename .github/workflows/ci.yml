name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "v4.0.5"

      - name: Sync Python CLI dependencies
        working-directory: platform/cli
        run: uv sync --locked --python 3.12 --extra dev

      - name: Lint Python CLI and sample app (including security rules)
        run: |
          uv run --directory platform/cli ruff check .
          uv run --project platform/cli ruff check --config platform/cli/pyproject.toml apps/payments-api

      - name: Run CLI and policy unit/integration tests
        working-directory: platform/cli
        run: uv run pytest -v

      - name: Run sample app unit tests
        run: uv run --project platform/cli pytest -v apps/payments-api/tests/test_app.py

      - name: Validate GitOps Argo CD YAML syntax
        run: |
          uv run --project platform/cli python -c '
          from pathlib import Path
          import yaml
          for path in sorted(Path("gitops/argocd").glob("*.yaml")):
              docs = [d for d in yaml.safe_load_all(path.read_text(encoding="utf-8")) if d is not None]
              assert docs, f"No YAML documents found in {path}"
              print(f"OK {path} ({len(docs)} document(s))")
          '

      - name: Lint golden-path Helm chart
        run: helm lint platform/charts/web-service

      - name: Validate sample service specification
        run: uv run --project platform/cli idp validate services/payments-api/service.yaml --env all

      - name: Verify rendered manifests have zero drift
        run: |
          uv run --project platform/cli idp render services/payments-api/service.yaml --env all --out-dir rendered
          git diff --exit-code rendered/

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate rendered manifests against Kubernetes 1.35 schemas
        run: make schema-check
